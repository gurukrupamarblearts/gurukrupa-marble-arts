        }


        nav.navbar .nav-links a {
            display: inline-block !important;

            margin: 0 !important;

            padding: 5px 0 !important;

            border: none !important;

            color: #333333 !important;

            background: transparent !important;

            text-decoration: none !important;

        }


        nav.navbar .nav-links a:hover {

        /* =====================================================
           TEMPLE PAGE INTRO
           ===================================================== */

        .temple-intro {
            width: 100%;

            background: #faf8f3;

            text-align: center;

            padding: 80px 8% 60px;
        }


        .temple-intro h1 {
            color: #8f6d35;

            font-size: 45px;

            line-height: 1.2;

            margin: 0 0 20px;
        }


        .temple-intro p {
            max-width: 850px;

            margin: 0 auto;

            font-size: 18px;

            color: #333;
        }


        /* =====================================================
           TEMPLE GALLERY
           ===================================================== */

        .temple-gallery {
            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding: 50px 20px 80px;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 24px;
        }


        .temple-card {
            width: 100%;

            background: #fff;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .temple-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }


        .temple-card img {
            display: block;

            width: 100%;

            height: 280px;

            object-fit: cover;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }


        .temple-card:hover img {
            transform: scale(1.04);

            filter: brightness(0.94);
        }


        /* =====================================================
           LIGHTBOX
           ===================================================== */

        #temple-lightbox {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.94);

            z-index: 9999;

            align-items: center;

            justify-content: center;

            padding: 25px;

            cursor: pointer;
        }


        #temple-lightbox img {
            display: block;

            max-width: 92%;

            max-height: 90vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border: 2px solid #c9a15b;

            border-radius: 4px;
        }


        .lightbox-close {
            position: absolute;

            top: 20px;

            right: 30px;

            color: #fff;

            font-family: Arial, sans-serif;

            font-size: 42px;

            line-height: 1;

            cursor: pointer;

            z-index: 10000;
        }


        .lightbox-close:hover {
            color: #c9a15b;
        }


        /* =====================================================
           DESKTOP GUARANTEE
           ===================================================== */

        @media (min-width: 769px) {

            nav.navbar .nav-container {
                display: flex !important;

                flex-direction: row !important;

                align-items: center !important;

                justify-content: space-between !important;
            }

            nav.navbar .nav-links {
                display: flex !important;

                flex-direction: row !important;

                align-items: center !important;

                justify-content: flex-end !important;

                width: auto !important;

                margin-left: auto !important;
            }

        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 900px) and (min-width: 769px) {

            nav.navbar {
                padding-left: 5% !important;
                padding-right: 5% !important;
            }

            nav.navbar .nav-links {
                gap: 18px !important;
            }

            nav.navbar .nav-links a {
                font-size: 15px !important;
            }

            .temple-gallery {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 768px) {

            nav.navbar {
                min-height: auto !important;

                padding: 22px 20px !important;
            }


            nav.navbar .nav-container {
                width: 100% !important;

                height: auto !important;

                display: flex !important;

                flex-direction: column !important;

                align-items: center !important;

                justify-content: center !important;

                gap: 18px !important;
            }


            nav.navbar .logo {
                align-items: center !important;

                text-align: center !important;

                font-size: 21px !important;

                white-space: normal !important;
            }


            nav.navbar .logo span {
                font-size: 12px !important;
            }


            nav.navbar .nav-links {
                width: 100% !important;

                display: grid !important;

                grid-template-columns:
                    repeat(2, minmax(0, 1fr)) !important;

                gap: 10px !important;

                margin: 0 !important;
            }


            nav.navbar .nav-links a {
                width: 100% !important;

                text-align: center !important;

                padding: 8px 4px !important;

                border-bottom: 1px solid #eee !important;

                white-space: normal !important;
            }


            .temple-intro {
                padding: 60px 6% 45px;
            }


            .temple-intro h1 {
                font-size: 38px;
            }


            .temple-gallery {
                grid-template-columns: 1fr;

                max-width: 500px;

                padding:
                    30px 15px 60px;
            }


            .temple-card img {
                height: 270px;
            }

        }


        /* =====================================================
           SMALL MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            nav.navbar .nav-links {
                grid-template-columns: 1fr !important;
            }


            .temple-intro h1 {
                font-size: 32px;
            }


            .temple-card img {
                height: 250px;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        function openTempleLightbox(imageSrc) {

            const lightbox =
                document.getElementById("temple-lightbox");

            const image =
                document.getElementById("temple-lightbox-img");


            image.src = imageSrc;

            lightbox.style.display = "flex";

            document.body.style.overflow = "hidden";
        }


        function closeTempleLightbox(event) {

            if (event) {
                event.stopPropagation();
            }


            const lightbox =
                document.getElementById("temple-lightbox");

            const image =
                document.getElementById("temple-lightbox-img");


            lightbox.style.display = "none";

            image.src = "";

            document.body.style.overflow = "";
        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeTempleLightbox();

                }

            }
        );

    </script>
