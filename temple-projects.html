    <style>

        /* =====================================================
           TEMPLE PROJECT PAGE
           ===================================================== */

        .temple-page {
            width: 100%;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           PAGE INTRO
           ===================================================== */

        .temple-intro {
            width: 100%;

            background: #faf8f3;

            text-align: center;

            padding: 80px 8% 60px;
        }

        .temple-intro h1 {
            color: #8f6d35;

            font-size: 45px;

            line-height: 1.2;

            margin-bottom: 20px;
        }

        .temple-intro p {
            max-width: 850px;

            margin: 0 auto;

            font-size: 18px;

            color: #333;
        }


        /* =====================================================
           GALLERY
           ===================================================== */

        .temple-gallery {
            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding: 50px 20px 80px;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 24px;
        }


        /* =====================================================
           GALLERY CARD
           ===================================================== */

        .temple-card {
            width: 100%;

            background: #fff;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .temple-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }


        /* =====================================================
           GALLERY IMAGE
           ===================================================== */

        .temple-card img {
            display: block;

            width: 100%;

            height: 280px;

            object-fit: cover;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;
        }

        .temple-card:hover img {
            transform: scale(1.04);

            filter: brightness(0.94);
        }


        /* =====================================================
           LIGHTBOX
           ===================================================== */

        #temple-lightbox {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.94);

            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 25px;

            cursor: pointer;
        }

        #temple-lightbox img {
            display: block;

            max-width: 92%;

            max-height: 90vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border: 2px solid #c9a15b;

            border-radius: 4px;
        }


        /* =====================================================
           LIGHTBOX CLOSE BUTTON
           ===================================================== */

        .lightbox-close {
            position: absolute;

            top: 20px;

            right: 30px;

            color: #fff;

            font-size: 42px;

            line-height: 1;

            font-family: Arial, sans-serif;

            cursor: pointer;

            z-index: 10000;
        }

        .lightbox-close:hover {
            color: #c9a15b;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 900px) {

            .temple-intro {
                padding:
                    70px 6% 50px;
            }

            .temple-intro h1 {
                font-size: 40px;
            }

            .temple-gallery {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 20px;

                padding:
                    40px 20px 60px;
            }

            .temple-card img {
                height: 250px;
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .temple-intro {
                padding:
                    55px 6% 40px;
            }

            .temple-intro h1 {
                font-size: 34px;
            }

            .temple-intro p {
                font-size: 17px;
            }

            .temple-gallery {

                grid-template-columns: 1fr;

                max-width: 500px;

                padding:
                    30px 15px 50px;
            }

            .temple-card img {
                height: 270px;
            }

            #temple-lightbox img {
                max-width: 96%;
                max-height: 82vh;
            }

            .lightbox-close {
                top: 15px;
                right: 20px;
                font-size: 36px;
            }
        }

    </style>

</head>

    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        function openTempleLightbox(imageSrc) {

            var lightbox =
                document.getElementById("temple-lightbox");

            var image =
                document.getElementById("temple-lightbox-img");


            image.src = imageSrc;

            lightbox.style.display = "flex";

            document.body.style.overflow = "hidden";
        }



        function closeTempleLightbox(event) {

            if (event) {

                event.stopPropagation();

            }


            var lightbox =
                document.getElementById("temple-lightbox");

            var image =
                document.getElementById("temple-lightbox-img");


            lightbox.style.display = "none";

            image.src = "";

            document.body.style.overflow = "";
        }



        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeTempleLightbox();

                }

            }
        );

    </script>
